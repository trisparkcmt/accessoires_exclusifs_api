# ─── Zones de Rate Limiting Nginx (Alignées sur DRF settings.py) ───────────────
# Note: Ces directives limit_req_zone doivent être placées au niveau http {}
# dans /etc/nginx/nginx.conf ou incluses avant les blocs server {}.

limit_req_zone $binary_remote_addr zone=limit_login:10m          rate=2r/m;
limit_req_zone $binary_remote_addr zone=limit_register:10m       rate=1r/m;
limit_req_zone $binary_remote_addr zone=limit_password_reset:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=limit_ia:10m             rate=2r/m;

server {
    listen 80;
    server_name api.accessoiresexclusifs.com;

    # Rediriger tout le trafic HTTP vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.accessoiresexclusifs.com;

    # ─── SSL / TLS (Let's Encrypt via Certbot) ───────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.accessoiresexclusifs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.accessoiresexclusifs.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Paramètres de sécurité ───────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ─── Taille max des uploads (images, fichiers) ───────────────────────────
    client_max_body_size 20M;

    # ─── Fichiers statiques (Django collectstatic → /var/www/.../staticfiles) ─
    location /static/ {
        alias /var/www/accessoiresexclusifs/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ─── Fichiers médias locaux (si AWS S3 n'est pas utilisé) ────────────────
    # Décommenter uniquement si USE_S3=False
    # location /media/ {
    #     alias /var/www/accessoiresexclusifs/backend/media/;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    # ─── Proxy vers Gunicorn (toutes les requêtes API et admin) ──────────────
    location / {
        proxy_pass          http://unix:/run/gunicorn/gunicorn.sock;
        proxy_http_version  1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  120s;

        # Buffers
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ─── Rate limiting Nginx aligné sur Django DRF settings ────────────────────
    
    # 1. Connexion (Login: Standard, Web, Mobile)
    location ~ ^/api/v1/auth/(login|web/login|mobile/login)/ {
        limit_req zone=limit_login burst=10 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Inscription
    location ~ ^/api/v1/auth/registration/ {
        limit_req zone=limit_register burst=3 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Réinitialisation de mot de passe
    location ~ ^/api/v1/auth/password/reset/ {
        limit_req zone=limit_password_reset burst=5 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Laboratoire IA (Recommandation & Chat)
    location ~ ^/api/v1/lab/ia-(recommandation|conversations)/ {
        limit_req zone=limit_ia burst=5 nodelay;
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Sécurité : Interdire l'accès direct aux fichiers cachés (.env, .git, etc.) ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/accessoiresexclusifs_access.log;
    error_log  /var/log/nginx/accessoiresexclusifs_error.log warn;
}
