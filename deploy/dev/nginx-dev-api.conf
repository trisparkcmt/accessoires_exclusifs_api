# ============================================================
# Nginx vhost — API Dev (dev-api.accessoiresexclusifs.com)
# À placer dans : /etc/nginx/sites-available/dev-api.accessoiresexclusifs.com
# Puis activer  : ln -s /etc/nginx/sites-available/dev-api.accessoiresexclusifs.com \
#                          /etc/nginx/sites-enabled/
# SSL via certbot : certbot --nginx -d dev-api.accessoiresexclusifs.com
# ============================================================

server {
    listen 80;
    server_name dev-api.accessoiresexclusifs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-api.accessoiresexclusifs.com;

    # Certificats SSL (générés par certbot)
    ssl_certificate     /etc/letsencrypt/live/dev-api.accessoiresexclusifs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.accessoiresexclusifs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs séparés
    access_log /var/log/nginx/dev-api_access.log;
    error_log  /var/log/nginx/dev-api_error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://unix:/run/gunicorn_dev.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/accessoiresexclusifs_dev/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/accessoiresexclusifs_dev/media/;
        expires 7d;
    }
}
