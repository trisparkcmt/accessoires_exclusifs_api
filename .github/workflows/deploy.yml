name: Continuous Deployment (CD Prod)

on:
  push:
    branches:
      - master  # VPS Hostinger uniquement

jobs:
  test-prod:
    name: Run Django Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
        run: |
          python manage.py test --noinput

  deploy:
    name: Deploy to Hostinger VPS
    needs: test-prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/accessoiresexclusifs
            git config --global --add safe.directory /var/www/accessoiresexclusifs
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            source venv/bin/activate
            pip install -r requirements.txt -q
            python manage.py collectstatic --noinput -v 0
            python manage.py migrate --noinput
            cp deploy/gunicorn.service /etc/systemd/system/gunicorn.service
            systemctl daemon-reload
            systemctl restart gunicorn
            systemctl reload nginx

  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: [test-prod, deploy]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.test-prod.result }}" = "success" ]; then
            echo "status=✅ SUCCÈS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test-prod.result }}" = "failure" ]; then
            echo "status=❌ ÉCHEC DES TESTS" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=❌ ÉCHEC DU DÉPLOIEMENT" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send email alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: "CI/CD Accessoires Exclusifs <${{ secrets.ALERT_EMAIL_USER }}>"
          subject: "[${{ steps.status.outputs.emoji }} PROD] Déploiement master — ${{ steps.status.outputs.status }}"
          body: |
            Bonjour,

            Résultat du déploiement PRODUCTION (branche master) :

            Statut      : ${{ steps.status.outputs.status }}
            Commit      : ${{ github.sha }}
            Message     : ${{ github.event.head_commit.message }}
            Auteur      : ${{ github.event.head_commit.author.name }}
            Date        : ${{ github.event.head_commit.timestamp }}

            Tests       : ${{ needs.test-prod.result }}
            Déploiement : ${{ needs.deploy.result }}

            Voir le détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            --
            CI/CD Accessoires Exclusifs
