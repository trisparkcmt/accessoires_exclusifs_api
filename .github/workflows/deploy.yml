name: Continuous Deployment (CD Prod)

on:
  push:
    branches:
      - master  # VPS Hostinger uniquement

jobs:
  test-prod:
    name: Run Django Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
        run: |
          python manage.py test --noinput

  deploy:
    name: Deploy to Hostinger VPS
    needs: test-prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/accessoiresexclusifs
            git config --global --add safe.directory /var/www/accessoiresexclusifs
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            source venv/bin/activate
            pip install -r requirements.txt -q
            python manage.py collectstatic --noinput -v 0
            python manage.py migrate --noinput
            cp deploy/gunicorn.service /etc/systemd/system/gunicorn.service
            systemctl daemon-reload
            systemctl restart gunicorn
            systemctl reload nginx
