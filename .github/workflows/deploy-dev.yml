name: Deploy Dev API (main branch)

on:
  push:
    branches:
      - main

jobs:
  test-dev:
    name: Run Django Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
        run: |
          python manage.py test --noinput

  deploy-dev:
    name: Deploy Dev API to Hostinger VPS
    needs: test-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment on VPS for Dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/accessoiresexclusifs_dev
            git config --global --add safe.directory /var/www/accessoiresexclusifs_dev
            bash deploy/dev/deploy.sh
