name: Deploy Dev API (main branch)

on:
  push:
    branches:
      - main

jobs:
  test-dev:
    name: Run Django Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SECRET_KEY: 'test-secret-key-for-ci-cd'
          DEBUG: 'True'
        run: |
          python manage.py test --noinput

  deploy-dev:
    name: Deploy Dev API to Hostinger VPS
    needs: test-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment on VPS for Dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/accessoiresexclusifs_dev
            git config --global --add safe.directory /var/www/accessoiresexclusifs_dev
            bash deploy/dev/deploy.sh

  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: [test-dev, deploy-dev]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy-dev.result }}" = "success" ] && [ "${{ needs.test-dev.result }}" = "success" ]; then
            echo "status=✅ SUCCÈS" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test-dev.result }}" = "failure" ]; then
            echo "status=❌ ÉCHEC DES TESTS" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=❌ ÉCHEC DU DÉPLOIEMENT" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send email alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: "CI/CD Accessoires Exclusifs <${{ secrets.ALERT_EMAIL_USER }}>"
          subject: "[${{ steps.status.outputs.emoji }} DEV] Déploiement main — ${{ steps.status.outputs.status }}"
          body: |
            Bonjour,

            Résultat du déploiement DEV (branche main) :

            Statut      : ${{ steps.status.outputs.status }}
            Commit      : ${{ github.sha }}
            Message     : ${{ github.event.head_commit.message }}
            Auteur      : ${{ github.event.head_commit.author.name }}
            Date        : ${{ github.event.head_commit.timestamp }}

            Tests       : ${{ needs.test-dev.result }}
            Déploiement : ${{ needs.deploy-dev.result }}

            Voir le détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            --
            CI/CD Accessoires Exclusifs
